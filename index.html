<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاختبارات الإلكتروني</title>
    <style>
        :root {
            --primary: #008CBA;
            --success: #4CAF50;
            --danger: #f44336;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-exam {
            background-color: var(--primary);
        }
        .btn-exam:hover { background-color: #007399; }

        .btn-admin {
            background-color: var(--danger);
            margin-top: 20px;
        }
        .btn-admin:hover { background-color: #d32f2f; }

        .btn-back {
            background-color: #757575;
            margin-bottom: 20px;
        }
        .btn-back:hover { background-color: #616161; }

        .student-btn {
            background-color: var(--success);
            margin-bottom: 10px;
            text-align: right;
            padding: 15px 20px;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .student-btn:hover { background-color: #388E3C; }

        .divider {
            height: 1px;
            background-color: #eee;
            margin: 25px 0;
        }

        /* إخفاء قسم الإدارة افتراضياً */
        #admin-section {
            display: none;
        }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية للطالب -->
    <div class="container" id="student-section">
        <h2>نظام الاختبارات الإلكتروني</h2>
        
        <div class="form-group">
            <label for="studentName">الاسم الثلاثي:</label>
            <input type="text" id="studentName" placeholder="أدخل اسمك الثلاثي هنا..." required>
        </div>

        <div class="form-group">
            <label for="department">القسم / التخصص:</label>
            <select id="department" required>
                <option value="" disabled selected>اختر قسمك...</option>
                <option value="الذكاء الاصطناعي">الذكاء الاصطناعي</option>
                <option value="الأمن السيبراني">الأمن السيبراني</option>
                <option value="هندسة البرمجيات">هندسة البرمجيات</option>
                <option value="علوم الحاسوب">علوم الحاسوب</option>
                <option value="تقنية المعلومات">تقنية المعلومات</option>
            </select>
        </div>

        <button class="btn-exam" onclick="startExam()">تسجيل وبدء الاختبار النهائي</button>

        <div class="divider"></div>

        <button class="btn-admin" onclick="openAdmin()">دخول الإدارة (للمشرفين فقط)</button>
    </div>

    <!-- واجهة الإدارة -->
    <div class="container" id="admin-section">
        <h2>لوحة الإدارة - بيانات الطلاب</h2>
        <button class="btn-back" onclick="closeAdmin()">رجوع للرئيسية</button>
        
        <div id="students-list">
            <!-- سيتم إضافة أزرار الطلاب هنا برمجياً -->
        </div>
    </div>

    <script>
        // مصفوفة لحفظ بيانات الطلاب مؤقتاً
        let studentsDatabase = [];

        // دالة تسجيل الطالب وبدء الاختبار
        function startExam() {
            const nameInput = document.getElementById('studentName');
            const deptInput = document.getElementById('department');
            
            const name = nameInput.value.trim();
            const dept = deptInput.value;

            if (!name || !dept) {
                alert("تنبيه: الرجاء إدخال الاسم الثلاثي واختيار القسم أولاً!");
                return;
            }

            // حفظ بيانات الطالب في المصفوفة
            studentsDatabase.push({ name: name, department: dept });

            alert(`مرحباً بك يا ${name} من قسم ${dept}!\nتم تسجيلك كطالب مجتهد، سيتم تحويلك للاختبار الآن...`);

            // تفريغ الحقول لتكون جاهزة لطالب آخر
            nameInput.value = '';
            deptInput.value = '';
        }

        // دالة فتح لوحة الإدارة
        function openAdmin() {
            const password = prompt("الرجاء إدخال كلمة مرور المشرف:");
            
            // كلمة المرور الافتراضية هي admin123
            if (password === "admin123") {
                document.getElementById('student-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                renderStudents();
            } else if (password !== null) { // إذا لم يضغط على "إلغاء"
                alert("خطأ: كلمة المرور غير صحيحة. الوصول مرفوض!");
            }
        }

        // دالة إغلاق لوحة الإدارة والعودة للرئيسية
        function closeAdmin() {
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('student-section').style.display = 'block';
        }

        // دالة إنشاء أزرار الطلاب في لوحة الإدارة
        function renderStudents() {
            const listContainer = document.getElementById('students-list');
            listContainer.innerHTML = ''; // مسح المحتوى القديم

            if (studentsDatabase.length === 0) {
                listContainer.innerHTML = '<p style="color: #666;">لا يوجد طلاب مسجلين في الاختبار حتى الآن.</p>';
                return;
            }

            // إنشاء زر لكل طالب في المصفوفة
            studentsDatabase.forEach((student, index) => {
                const btn = document.createElement('button');
                btn.className = 'student-btn';
                btn.innerHTML = `🎓 الطالب: ${student.name} <br> 📚 التخصص: ${student.department}`;
                
                // حدث عند الضغط على زر الطالب (لمعرفة تفاصيله)
                btn.onclick = function() {
                    alert(`تفاصيل الطالب:\n\nالاسم: ${student.name}\nالقسم: ${student.department}\nتقييم النظام: مستعد للاختبار ومجتهد!`);
                };

                listContainer.appendChild(btn);
            });
        }
    </script>
</body>
</html>
